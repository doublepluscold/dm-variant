<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Колохвіум · Варіант</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f5fbf">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS: без цього «На екран Домівки» відкривається у звичайному Safari з адресним рядком -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Колохвіум">
<script>
/* тему ставимо до першої відрисовки, щоб не блимало */
try{const t=localStorage.getItem('kolok_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
/* стиль iDroo: зошит у клітинку, кожен Nivel свого кольору */
:root{
  --paper:#fbfcfe; --grid:#dde6f2; --card:#fff; --ink:#0f1b2d; --mut:#51637f; --line:#cbd7e8;
  --acc:#1a56b0; --acc-soft:#d7e6fb; --warn-bg:#fff6dd; --warn-line:#dca92f;
  --note-bg:#e2f4ec; --note-line:#3f9c74; --sticker:#a9c9f2; --on-acc:#fff; --fs:17px;
}
.lv1{--c:#2e9d5b; --c-soft:#ebf7f0; --c-ink:#1d6b3e; --c-badge:#1d6b3e; --c-on:#fff}
.lv2{--c:#2f6fd6; --c-soft:#e9f1fd; --c-ink:#1c4fa3; --c-badge:#1c4fa3; --c-on:#fff}
.lv3{--c:#cf6a0a; --c-soft:#fff2e3; --c-ink:#9a4f06; --c-badge:#9a4f06; --c-on:#fff}
.lv4{--c:#d63a3a; --c-soft:#fdecec; --c-ink:#a12525; --c-badge:#a12525; --c-on:#fff}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1520; --grid:#1a2433; --card:#152031; --ink:#e6edf8; --mut:#93a6c4; --line:#26364d;
    --acc:#7fb0ff; --acc-soft:#1b2f50; --warn-bg:#2e2713; --warn-line:#8a7430;
    --note-bg:#102a21; --note-line:#2f7a58; --sticker:#2b4a78; --on-acc:#0b1424;
  }
  :root:not([data-theme="light"]) .lv1{--c:#3fb872; --c-soft:#11261a; --c-ink:#86e0aa; --c-badge:#3fb872; --c-on:#08130c}
  :root:not([data-theme="light"]) .lv2{--c:#5b93ff; --c-soft:#13213a; --c-ink:#a3c2ff; --c-badge:#5b93ff; --c-on:#08101e}
  :root:not([data-theme="light"]) .lv3{--c:#f0953a; --c-soft:#2b1d0e; --c-ink:#ffc48a; --c-badge:#f0953a; --c-on:#1a0f03}
  :root:not([data-theme="light"]) .lv4{--c:#ef5f5f; --c-soft:#2e1416; --c-ink:#ffa3a3; --c-badge:#ef5f5f; --c-on:#1c0707}
}
:root[data-theme="dark"]{
  --paper:#0e1520; --grid:#1a2433; --card:#152031; --ink:#e6edf8; --mut:#93a6c4; --line:#26364d;
  --acc:#7fb0ff; --acc-soft:#1b2f50; --warn-bg:#2e2713; --warn-line:#8a7430;
  --note-bg:#102a21; --note-line:#2f7a58; --sticker:#2b4a78; --on-acc:#0b1424;
}
:root[data-theme="dark"] .lv1{--c:#3fb872; --c-soft:#11261a; --c-ink:#86e0aa; --c-badge:#3fb872; --c-on:#08130c}
:root[data-theme="dark"] .lv2{--c:#5b93ff; --c-soft:#13213a; --c-ink:#a3c2ff; --c-badge:#5b93ff; --c-on:#08101e}
:root[data-theme="dark"] .lv3{--c:#f0953a; --c-soft:#2b1d0e; --c-ink:#ffc48a; --c-badge:#f0953a; --c-on:#1a0f03}
:root[data-theme="dark"] .lv4{--c:#ef5f5f; --c-soft:#2e1416; --c-ink:#ffa3a3; --c-badge:#ef5f5f; --c-on:#1c0707}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;
  /* safe-area: у standalone-режимі на iPhone контент інакше лізе під «чубчик» і під смугу Home */
  padding:env(safe-area-inset-top,0px)
          calc(16px + env(safe-area-inset-right,0px))
          calc(64px + env(safe-area-inset-bottom,0px))
          calc(16px + env(safe-area-inset-left,0px));
}
.wrap{max-width:860px;margin:0 auto}
header{padding:22px 0 12px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tools{display:flex;gap:6px;flex:0 0 auto;padding-top:4px}
.icon{width:44px;height:44px;padding:0;display:inline-grid;place-items:center;font-weight:700}
.icon svg{width:20px;height:20px}
/* наліпка як «Колоквіум» на дошці iDroo */
h1{display:inline-block;font-size:1.3rem;margin:0 0 10px;letter-spacing:-.01em;
  background:var(--sticker);color:var(--ink);padding:10px 18px 11px;border-radius:3px;
  transform:rotate(-1.2deg);box-shadow:3px 4px 0 rgba(15,27,45,.12)}
.sub{color:var(--mut);font-size:.84rem;margin:0}

/* ---- control bar ---- */
.bar{
  padding:10px 0 12px;border-bottom:1.5px solid var(--line);margin-bottom:16px;
}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=number]{
  flex:1 1 120px;min-width:0;font-size:1.5rem;font-weight:700;text-align:center;
  padding:10px 8px;border:2px solid var(--acc);border-radius:12px;
  background:var(--card);color:var(--ink);-moz-appearance:textfield;
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button{
  font:inherit;font-size:.92rem;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
button:active{transform:translateY(1px)}
button{min-height:44px}
/* сегментований перемикач вкладок, як в iOS */
.tabs{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:9px;background:transparent;color:var(--mut);font-weight:650;min-height:40px}
.tabs button.on{background:var(--acc);color:var(--on-acc)}
/* таймер: одна кнопка, яка і запускає, і показує час */
#tstart{font-variant-numeric:tabular-nums;font-weight:700;background:var(--acc-soft);color:var(--acc);
  border-color:transparent;white-space:nowrap}
#tstart.hot{background:#ffe0e0;color:#b3261e}
.hint{color:var(--mut);font-size:.82rem;margin:8px 2px 0}

/* ---- cards ---- */
.calc{font-size:.82rem;color:var(--mut);margin:10px 0 0;line-height:1.7}
.calc code{background:var(--c-soft,var(--acc-soft));color:var(--c-ink,var(--acc));
  border:1px solid var(--c,transparent);padding:0 6px;border-radius:4px;font-size:.92em}
.calc .cl{display:block;color:var(--c-ink)}
.calc a{text-decoration:none}
.calc a code{display:inline-block;padding:3px 8px;margin:2px 0}
.calc .cl b{font-weight:700}
/* заголовок рівня — підсвічена мітка, як «Nivel 2» на дошці */
.lvl{display:inline-block;margin:26px 0 10px;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;
  font-weight:700;color:var(--c-ink);background:var(--c-soft);border-left:4px solid var(--c);
  padding:4px 10px 4px 8px;border-radius:0 4px 4px 0}
.lvl em{font-style:italic;text-transform:none;letter-spacing:.02em;font-size:1.12em}
.q{background:var(--c-soft);border:2px solid var(--c);border-radius:5px;padding:14px 15px 16px;margin-bottom:14px}
.qh{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.num{flex:0 0 auto;background:var(--c-badge);color:var(--c-on);font-weight:700;font-size:.8rem;
  border-radius:4px;padding:3px 9px;line-height:1.4}
.qt{font-weight:700;line-height:1.35;color:var(--c-ink)}
.q p{margin:.55em 0}
.q ul,.q ol{margin:.5em 0;padding-left:1.3em}
.q li{margin:.25em 0}
.box{background:var(--card);border-left:3px solid var(--c);border-radius:0 6px 6px 0;padding:10px 12px;margin:.7em 0}
/* перемикач повне / скорочене */
.sw{display:inline-flex;border:1.5px solid var(--c);border-radius:6px;overflow:hidden;margin:2px 0 10px}
.sw button{border:0;border-radius:0;background:var(--card);color:var(--c-ink);
  font-size:.84rem;font-weight:600;padding:6px 14px;min-height:40px}
.sw button+button{border-left:1.5px solid var(--c)}
.sw button.on{background:var(--c-badge);color:var(--c-on)}
[hidden]{display:none!important}
.q{scroll-margin-top:12px}

/* ---- «Усі питання»: згрупований список-акордеон ---- */
.acc{border:2px solid var(--c);border-radius:6px;background:var(--card);overflow:hidden;margin-bottom:8px}
.qa+.qa{border-top:1px solid var(--line)}
.qa summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;min-height:48px;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"";flex:0 0 auto;width:8px;height:8px;margin:7px 2px 0 auto;
  border-right:2px solid var(--c);border-bottom:2px solid var(--c);transform:rotate(45deg);transition:transform .2s}
.qa[open] summary::after{transform:rotate(-135deg);margin-top:11px}
.qa[open] summary{background:var(--c-soft)}
.qa summary .qt{font-weight:600;color:var(--ink)}
.qa[open] summary .qt{color:var(--c-ink);font-weight:700}
.qa summary .num{min-width:2.4em;text-align:center}
.qa-b{padding:4px 14px 14px;background:var(--c-soft)}

/* кнопка «нагору» */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border-radius:50%;padding:0;font-size:1.3rem;font-weight:700;z-index:20;
  background:var(--acc);color:var(--on-acc);border:0;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.note{background:var(--note-bg);border-left:3px solid var(--note-line);border-radius:0 10px 10px 0;padding:10px 12px;margin:.7em 0;font-size:.92em}
.warn{background:var(--warn-bg);border-left:3px solid var(--warn-line);border-radius:0 10px 10px 0;padding:10px 12px;margin:.7em 0;font-size:.92em}
.note b,.warn b{display:block;font-size:.8em;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;opacity:.75}
.lbl{font-weight:650}
.eq{display:block;overflow-x:auto;overflow-y:hidden;padding:.45em 0;text-align:center;line-height:2.1}
.eq.l{text-align:left}
.qed{float:right;font-size:1.1em}
.tip{color:var(--mut);font-size:.88em}

/* ---- math primitives ---- */
i{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:1.06em}
.bn{white-space:nowrap;display:inline-block}
.ss{display:inline-block;vertical-align:-.42em;line-height:1;font-size:.68em;text-align:left;margin-left:.04em}
.ss>sup,.ss>sub{display:block;position:static;font-size:1em;line-height:1.08;margin:0;white-space:nowrap}
.ss sub sub,.ss sub sup,.ss sup sub,.ss sup sup{display:inline;font-size:.8em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 .15em}
.frac>span{padding:0 .35em}
.frac>span:first-child{border-bottom:1.3px solid currentColor}
.rad{display:inline-block;white-space:nowrap}
.rad>sup{font-size:.62em;margin-right:-.42em;vertical-align:.72em}
.rb{border-top:1.3px solid currentColor;padding:0 .18em 0 .1em}
.sum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  font-size:.62em;line-height:1.05;margin:0 .2em}
.sum>.sg{font-size:2.1em;line-height:.9}
.ov{border-top:1.3px solid currentColor}

/* ---- misc ---- */
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:.95rem}
.egg{margin:52px auto 0;width:max-content;text-align:center;line-height:.92;user-select:none;
  font-family:Georgia,"Times New Roman",serif;color:var(--ink);opacity:.28;
  transition:opacity .35s ease,transform .35s ease}
.egg:hover,.egg:active{opacity:1;transform:scale(1.06)}
.egg .r1{font-size:2.7rem;font-weight:700;letter-spacing:.08em}
.egg .r1 b{color:#e0232e;font-weight:400;font-family:-apple-system,"Segoe UI Symbol",sans-serif;
  font-size:1.34em;line-height:1;vertical-align:-.07em}
.egg .r2{font-size:1.45rem;font-weight:700;letter-spacing:.16em;margin-top:.14em}
footer code{background:var(--acc-soft);color:var(--acc);padding:1px 5px;border-radius:5px}
footer{color:var(--mut);font-size:.8rem;text-align:center;margin-top:34px;line-height:1.7}
@media (max-width:420px){ .qh{flex-wrap:wrap} }
@media print{
  body{background:#fff;color:#000;padding:0;--fs:12px}
  .bar,footer,.noprint,.sw{display:none!important}
  .q{break-inside:avoid;margin-bottom:8px;padding:8px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="top">
    <h1>Колохвіум</h1>
    <div class="tools">
      <button class="icon" id="fminus" aria-label="Зменшити шрифт">A−</button>
      <button class="icon" id="fplus" aria-label="Збільшити шрифт">A+</button>
      <button class="icon" id="theme" aria-label="Змінити тему"></button>
    </div>
  </div>
  <p class="sub">Дискретна математика · колоквіум</p>
</header>

<div class="bar">
  <div class="tabs" role="tablist">
    <button id="tab-var" class="on" role="tab" aria-selected="true">Мій варіант</button>
    <button id="tab-all" role="tab" aria-selected="false">Усі питання</button>
  </div>
  <div id="pane-var">
    <div class="row">
      <input id="k" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="100" value="0" aria-label="Номер варіанту">
      <button class="primary" id="go">Порахувати</button>
      <button id="tstart" aria-label="Таймер 7 хвилин"><span class="ti">▶</span> <span id="timer">7:00</span></button>
    </div>
    <div class="calc" id="calc"></div>
  </div>
  <p class="hint" id="pane-all" hidden>Тапни питання, щоб побачити відповідь.</p>
</div>

<div id="out"><p class="empty">Введи номер варіанту від 1 до 100 і натисни «Порахувати»</p></div>
<div id="list" hidden></div>

<button class="fab noprint" id="totop" aria-label="Нагору" hidden>↑</button>

<div class="egg noprint" aria-hidden="true">
  <div class="r1">I <b>♥</b></div>
  <div class="r2">KINSTROER</div>
</div>

</div>
<script>
/* ---------- math helpers ---------- */
const C=(n,k)=>`<span class="bn"><i>C</i><span class="ss"><sup>${k}</sup><sub>${n}</sub></span></span>`;
const A=(n,k)=>`<span class="bn"><i>A</i><span class="ss"><sup>${k}</sup><sub>${n}</sub></span></span>`;
const P=n=>`<i>P</i><sub>${n}</sub>`;
const s=(x,i)=>`<i>${x}</i><sub>${i}</sub>`;
const f=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const rt=(idx,x)=>`<span class="rad"><sup>${idx}</sup>√<span class="rb">${x}</span></span>`;
const sum=(top,bot)=>`<span class="sum"><span>${top}</span><span class="sg">∑</span><span>${bot}</span></span>`;
const eq=x=>`<span class="eq">${x}</span>`;
const eql=x=>`<span class="eq l">${x}</span>`;
const QED='<span class="qed">∎</span>';
const D='<span class="lbl">La definicion.</span> ';
const O='<span class="lbl">La observacion.</span> ';
const N='<span class="lbl">La notacion.</span> ';
const DEM='<span class="lbl">La demostracion.</span> ';

/* ================= NIVEL 1 — означення ================= */
const N1=[,
/*1*/{t:'Підмножина',a:`
<p>${D}Будемо казати, що <i>A</i> є <b>підмножиною</b> <i>B</i>, якщо будь-який елемент <i>A</i> є елементом <i>B</i> (навпаки необов'язково).</p>
<p>${N}<i>A</i> ⊆ <i>B</i>.</p>`},
/*2*/{t:'Власна підмножина',a:`
<p>${D}<i>A</i> називається <b>власною підмножиною</b> <i>B</i> ⇔ одночасно виконується:</p>
${eq(`<i>A</i> ⊆ <i>B</i> &nbsp;&nbsp;та&nbsp;&nbsp; <i>A</i> ≠ <i>B</i>`)}
<p>(інакше кажучи, в <i>B</i> входить множина <i>A</i> та ще якісь — хоча б один — «зайві» елементи).</p>
<p>${O}Будь-яка власна підмножина автоматично є «просто» підмножиною.</p>
<p>${N}<i>A</i> ⊂ <i>B</i>.</p>`},
/*3*/{t:'Порожня множина',a:`
<p>${D}<b>Порожня множина</b> — множина, яка НЕ містить жодного елементу.</p>
<p>${N}Порожню множину позначають ∅.</p>`},
/*4*/{t:'Універсальна множина',a:`
<p>${D}<b>Універсальна множина</b> <i>X</i> — це така множина, яка містить усі елементи, де поняття «усі елементи» залежить від контексту (наприклад, якщо задача про натуральні числа, то в ролі <i>X</i> виступає ℕ).</p>`},
/*5*/{t:'Перетин множин',a:`
<p><b>Перетин</b> множин <i>A</i> і <i>B</i> — множина тих елементів, які належать <b>обом</b> множинам <i>A</i> і <i>B</i>:</p>
${eq(`<i>A</i> ∩ <i>B</i> = {<i>x</i> ∣ <i>x</i> ∈ <i>A</i>, <i>x</i> ∈ <i>B</i>}`)}`},
/*6*/{t:'Об’єднання множин',a:`
<p><b>Об'єднання</b> множин <i>A</i> і <i>B</i> — множина тих елементів, які належать <b>хоча б одній</b> з множин:</p>
${eq(`<i>A</i> ∪ <i>B</i> = {<i>x</i> ∣ <i>x</i> ∈ <i>A</i> або <i>x</i> ∈ <i>B</i>}`)}`},
/*7*/{t:'Різниця множин',a:`
<p><b>Різниця</b> множин <i>A</i> і <i>B</i> — множина тих елементів, які належать <i>A</i>, але НЕ належать <i>B</i>:</p>
${eq(`<i>A</i> ∖ <i>B</i> = {<i>x</i> ∣ <i>x</i> ∈ <i>A</i>, <i>x</i> ∉ <i>B</i>}`)}`},
/*8*/{t:'Симетрична різниця множин',a:`
<p><b>Симетрична різниця</b> множин <i>A</i> і <i>B</i> — множина тих елементів, які належать <b>рівно одній</b> з двох множин:</p>
${eq(`<i>A</i> Δ <i>B</i> = {<i>x</i> ∣ <i>x</i> ∈ <i>A</i>, <i>x</i> ∉ <i>B</i> АБО <i>x</i> ∉ <i>A</i>, <i>x</i> ∈ <i>B</i>}`)}
${eq(`= {<i>x</i> ∣ або <i>x</i> ∈ <i>A</i>, або <i>x</i> ∈ <i>B</i>}`)}`},
/*9*/{t:'Асоціативність перетину та об’єднання',a:`
${eq(`<i>A</i> ∪ (<i>B</i> ∪ <i>C</i>) = (<i>A</i> ∪ <i>B</i>) ∪ <i>C</i>`)}
${eq(`(<i>A</i> ∩ <i>B</i>) ∩ <i>C</i> = <i>A</i> ∩ (<i>B</i> ∩ <i>C</i>)`)}`},
/*10*/{t:'Дистрибутивність об’єднання відносно перетину та навпаки',a:`

/* ================= NIVEL 3 — нескладні доведення ================= */
const N3=[,
/*1*/{t:`Формула ${A('n','k')}`,a:`
<div class="box"><b>Тв.2.</b> Кіл-ть різних розміщень <i>k</i> елементів множини <i>M</i>, де ∣<i>M</i>∣ = <i>n</i>, рівна
${eq(`${A('n','k')} = ${f('<i>n</i>!','(<i>n</i> − <i>k</i>)!')} = <i>n</i> · (<i>n</i> − 1) · … · (<i>n</i> − <i>k</i> + 1)`)}</div>
<p>${DEM}Намалюємо загальний шаблон кортежу розміщення <i>k</i> елементів:</p>
${eq(`( …<sub class="tip">I м.</sub>, &nbsp; …<sub class="tip">II м.</sub>, &nbsp; … … , &nbsp; …<sub class="tip"><i>k</i>-те місце</sub> )`)}
<p>Та почнемо його почергово заповнювати. Треба виконати процедуру — заповнити кортеж — яка складається з <i>k</i> дій (заповнити першу координату, заповнити другу, …, заповнити <i>k</i>-ту).</p>
<p>Подивимось, скільки способів виконати кожну дію:</p>
<ul>
<li>заповнити <i>I</i> місце — <i>n</i> варіантів (можемо поставити довільний елемент <i>M</i>);</li>
<li>заповнити <i>II</i> місце — (<i>n</i> − 1) варіант (довільний елемент <i>M</i>, окрім того, який уже стоїть на I місці);</li>
<li>заповнити <i>III</i> місце — (<i>n</i> − 2) варіанти (окрім тих, які вже стоять на I та II місцях);</li>
<li>…</li>
<li>заповнити <i>k</i>-те місце — <i>n</i> − (<i>k</i> − 1) = <i>n</i> − <i>k</i> + 1 варіант (окрім тих, які вже стоять на I, II, …, (<i>k</i>−1)-му місцях).</li>
</ul>
<p>Тоді за правилом добутку варіантів заповнити кортеж у нас</p>

${eq(`(1 + <i>kx</i>)(1 + <i>x</i>) ≥<sup class="tip">?</sup> 1 + (<i>k</i>+1)<i>x</i> &nbsp; ∀<i>x</i> ≥ −1`)}
<p>Розкриваємо дужки:</p>
${eq(`1 + <i>kx</i> + <i>x</i> + <i>kx</i><sup>2</sup> ≥<sup class="tip">?</sup> 1 + <i>kx</i> + <i>x</i>`)}
${eq(`<i>kx</i><sup>2</sup> ≥ 0, &nbsp; що, очевидно, правда`)}
<p>${QED}</p>`},
/*2*/{t:'Поліноміальний коефіцієнт (доведення формули + тв.2)',a:`
<p>Розв'яжемо наступну задачу.</p>
<p>Нехай є множина <i>A</i> і ∣<i>A</i>∣ = <i>n</i>. Нехай є цілі невід'ємні числа ${s('k',1)}, ${s('k',2)}, …, ${s('k','m')} такі, що ${s('k',1)} + ${s('k',2)} + ⋯ + ${s('k','m')} = <i>n</i>. Скільки існує розбиттів множини <i>A</i> на <i>m</i> підмножин ${Ak(1)}, ${Ak(2)}, …, ${Ak('m')} таких, що ∣${Ak(1)}∣ = ${s('k',1)}, ∣${Ak(2)}∣ = ${s('k',2)}, …, ∣${Ak('m')}∣ = ${s('k','m')}?</p>
<p><span class="lbl">Зауваж.</span> «Розбиття» = кожен елемент <i>A</i> «відправляється» рівно до однієї з множин ${Ak(1)}, ${Ak(2)}, …, ${Ak('m')}. Порядок множин має значення.</p>
<p><span class="lbl">La solucion.</span> Треба виконати процедуру з <i>m</i> дій: вибрати елементи множини ${Ak(1)}, вибрати елементи мн. ${Ak(2)}, …, вибр. ел. множ. ${Ak('m')}.</p>
<p>Аналізуємо, скільки варіантів виконати кожну дію:</p>
<ul>
<li>вибрати елементи ${Ak(1)}: ${C('n',s('k',1))} варіантів (усі <i>n</i> елементів доступні, треба вибрати ${s('k',1)});</li>
<li>вибрати елементи ${Ak(2)}: ${C('n−k<sub>1</sub>',s('k',2))} варіантів (бо елементи ${Ak(1)} вибирати не можна);</li>
<li>вибрати елементи ${Ak(3)}: ${C('n−k<sub>1</sub>−k<sub>2</sub>',s('k',3))} варіантів (не можна вибирати ${Ak(1)} та ${Ak(2)});</li>
<li>…</li>
<li>вибрати елементи ${Ak('m')}: ${C('n−k<sub>1</sub>−⋯−k<sub>m−1</sub>',s('k','m'))} = ${C(s('k','m'),s('k','m'))} варіантів (не можна вибрати елем. ${Ak(1)}, …, ${Ak('m−1')}).</li>
</ul>
<p>За правилом добутку способів виконати усю процедуру тоді:</p>
${eq(`${C('n',s('k',1))} · ${C('n−k<sub>1</sub>',s('k',2))} · ${C('n−k<sub>1</sub>−k<sub>2</sub>',s('k',3))} ⋯ ${C('n−k<sub>1</sub>−⋯−k<sub>m−1</sub>',s('k','m'))} =`)}
${eq(`= ${f('<i>n</i>!','(k<sub>1</sub>)! <s>(<i>n</i>−k<sub>1</sub>)!</s>')} · ${f('<s>(<i>n</i>−k<sub>1</sub>)!</s>','(k<sub>2</sub>)! <s>(<i>n</i>−k<sub>1</sub>−k<sub>2</sub>)!</s>')} · ${f('<s>(<i>n</i>−k<sub>1</sub>−k<sub>2</sub>)!</s>','(k<sub>3</sub>)! <s>(<i>n</i>−k<sub>1</sub>−k<sub>2</sub>−k<sub>3</sub>)!</s>')} ⋯`)}
${eq(`⋯ ${f('<s>(<i>n</i>−k<sub>1</sub>−⋯−k<sub>m−1</sub>)!</s>','(k<sub>m</sub>)! (<i>n</i>−k<sub>1</sub>−⋯−k<sub>m−1</sub>−k<sub>m</sub>)!')} = ${f('<i>n</i>!','(k<sub>1</sub>)! (k<sub>2</sub>)! … (k<sub>m</sub>)!')}`)}
<p class="tip">((<i>n</i> − ${s('k',1)} − ${s('k',2)} − ⋯ − ${s('k','m')})! = 0! = 1, бо ${s('k',1)} + ${s('k',2)} + ⋯ + ${s('k','m')} = <i>n</i>.)</p>
<div class="box"><b>Озн.2.</b> Відповідь до цієї задачі і називають <b>поліноміальним коефіцієнтом</b> та позначають
${eq(`<i>C</i><sub>n</sub>(${s('k',1)}, ${s('k',2)}, …, ${s('k','m')}) = ${C('n','k<sub>1</sub>,k<sub>2</sub>,…,k<sub>m</sub>')} = ${f('<i>n</i>!','(k<sub>1</sub>)! (k<sub>2</sub>)! … (k<sub>m</sub>)!')}`)}</div>
<div class="box"><b>Тв.2.</b>
${eq(`(${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','m')})<sup>n</sup> = ${sum('','k<sub>1</sub>+k<sub>2</sub>+⋯+k<sub>m</sub>=n')} ${C('n','k<sub>1</sub>,k<sub>2</sub>,…,k<sub>m</sub>')} <i>a</i><sub>1</sub><sup>k<sub>1</sub></sup><i>a</i><sub>2</sub><sup>k<sub>2</sub></sup> … <i>a</i><sub>m</sub><sup>k<sub>m</sub></sup> =`)}
${eq(`= ${C('n','n,0,…,0')}<i>a</i><sub>1</sub><sup>n</sup> + ${C('n','n−1,1,0,…,0')}<i>a</i><sub>1</sub><sup>n−1</sup><i>a</i><sub>2</sub> + …`)}</div>
<p>${DEM}Як розкриваються дужки такого добутку: беруться всі можливі комбінації «щось із I дужки» × «щось із II дужки» × ⋯ × «щось із <i>n</i>-ї дужки», де з кожної дужки береться ${s('a',1)}, ${s('a',2)}, …, ${s('a','m−1')} або ${s('a','m')}.</p>
<p>Для того, щоб під час розкриття дужок (${s('a',1)} + ⋯ + ${s('a','m')})(${s('a',1)} + ⋯ + ${s('a','m')}) … (${s('a',1)} + ⋯ + ${s('a','m')}) отримати доданок <i>a</i><sub>1</sub><sup>k<sub>1</sub></sup><i>a</i><sub>2</sub><sup>k<sub>2</sub></sup> … <i>a</i><sub>m</sub><sup>k<sub>m</sub></sup>, потрібно:</p>
<ul>
<li>з якихось ${s('k',1)} дужок обрати ${s('a',1)};</li>
<li>з якихось ${s('k',2)} — обрати ${s('a',2)};</li>
<li>…</li>
<li>з ${s('k','m')} обрати ${s('a','m')}.</li>
</ul>
<p>Тобто <i>n</i> дужок треба розбити на <i>m</i> груп, де в <i>I</i> групі ${s('k',1)} дужок, у <i>II</i> — ${s('k',2)}, …, у <i>m</i>-й — ${s('k','m')}.</p>
<p>Усього варіантів це зробити якраз ${C('n','k<sub>1</sub>,k<sub>2</sub>,…,k<sub>m</sub>')}. ${QED}</p>`},
/*3*/{t:'Формула включення-виключення',a:`
<div class="box"><b>Формула включення — виключення для довільної кількості множин:</b> Нехай у нас є <i>k</i> скінченних множин ${Ak(1)}, ${Ak(2)}, …, ${Ak('k')}. Тоді:
${eql(`∣${Ak(1)} ∪ ${Ak(2)} ∪ ⋯ ∪ ${Ak('k')}∣ = ∣${Ak(1)}∣ + ∣${Ak(2)}∣ + ⋯ + ∣${Ak('k')}∣ −`)}
${eql(`&minus; ∣${Ak(1)} ∩ ${Ak(2)}∣ − ∣${Ak(1)} ∩ ${Ak(3)}∣ − ⋯ − ∣${Ak('k−1')} ∩ ${Ak('k')}∣ +`)}
${eql(`+ ∣${Ak(1)} ∩ ${Ak(2)} ∩ ${Ak(3)}∣ + ∣${Ak(1)} ∩ ${Ak(2)} ∩ ${Ak(4)}∣ + ⋯ + ∣${Ak('k−2')} ∩ ${Ak('k−1')} ∩ ${Ak('k')}∣ −`)}
${eql(`&minus; ∣${Ak(1)} ∩ ${Ak(2)} ∩ ${Ak(3)} ∩ ${Ak(4)}∣ − … &nbsp;&nbsp;…`)}
${eql(`+ (−1)<sup>k−1</sup>∣${Ak(1)} ∩ ${Ak(2)} ∩ ⋯ ∩ ${Ak('k')}∣ = ${sum('','1≤i<sub>1</sub>&lt;i<sub>2</sub>&lt;⋯&lt;i<sub>s</sub>≤k')} (−1)<sup>s−1</sup> ∣<i>A</i><sub>i<sub>1</sub></sub> ∩ <i>A</i><sub>i<sub>2</sub></sub> ∩ ⋯ ∩ <i>A</i><sub>i<sub>s</sub></sub>∣`)}</div>
<p>${DEM}Розіб'ємо універсальну множину на «шматочки», як ми це робили для 3 множин (шматочків буде 2<sup>k</sup>), та проаналізуємо кожен з них.</p>
<p>Нехай ми аналізуємо шматочок, де <i>x</i> ∈ ${Ak(1)}, <i>x</i> ∈ ${Ak(2)}, …, <i>x</i> ∈ ${Ak('s')}, <i>x</i> ∉ ${Ak('s+1')}, …, <i>x</i> ∉ ${Ak('k')} (тобто шматок, де <i>x</i> належить деяким конкретним <i>s</i> множинам та НЕ належить іншим; зрозуміло, що аналіз таких шматків буде аналогічний незалежно від того, про які саме <i>s</i> множин йдеться; тому вважаємо, що це ${Ak(1)}, ${Ak(2)}, …, ${Ak('s')}).</p>
<p><span class="lbl">ЛЧ:</span> такі елементи пораховані +1 раз.</p>
<p><span class="lbl">ПЧ:</span> Аналізуємо, в яких множинах елемент цього шматка присутній та з яким знаком:</p>
<ul>
<li>там, де додаються ∣<i>A</i><sub>i</sub>∣: &nbsp; 1 + 1 + ⋯ + 1 = <i>s</i> = ${C('s',1)} (<i>s</i> разів);</li>
<li>там, де віднімаються ∣<i>A</i><sub>i</sub> ∩ <i>A</i><sub>j</sub>∣: &nbsp; −∣${Ak(1)} ∩ ${Ak(2)}∣ − ∣${Ak(1)} ∩ ${Ak(3)}∣ − ⋯ − ∣${Ak('s−1')} ∩ ${Ak('s')}∣, тобто у тих перетинах, де перетинаються якісь з двох ${Ak(1)}, ${Ak(2)}, …, ${Ak('s')}. Тобто −1 − 1 − ⋯ − 1 (${C('s',2)}) = −${C('s',2)} разів;</li>
<li>там, де додаються по три: &nbsp; +1 + 1 + ⋯ + 1 (${C('s',3)} разів) = ${C('s',3)};</li>
<li>…</li>
<li>там, де додаються \\ віднімаються по <i>s</i>: &nbsp; (−1)<sup>s−1</sup>${C('s','s')};</li>
<li>там, де перетинаються <i>s</i> + 1 та більше: <b>0 разів</b> (у жодному перетині <i>x</i> немає).</li>
</ul>
<p>Усього: &nbsp; ${C('s',1)} − ${C('s',2)} + ${C('s',3)} − ⋯ + (−1)<sup>s−1</sup>${C('s','s')} = +1</p>
<p class="tip">(з вл. 4: ${C('s',0)} − ${C('s',1)} + ${C('s',2)} − ⋯ + (−1)<sup>s</sup>${C('s','s')} = 0, тобто 1 = ${C('s',0)} = ${C('s',1)} − ${C('s',2)} + ${C('s',3)} − ⋯ + (−1)<sup>s−1</sup>${C('s','s')}.)</p>
<p>Тобто і в правій частині ці <i>x</i> пораховані +1 раз.</p>
<p><span class="lbl">Зауваж.</span> Для шматка <i>x</i> ∉ ${Ak(1)}, <i>x</i> ∉ ${Ak(2)}, …, <i>x</i> ∉ ${Ak('k')} зрозуміло, що і в ЛЧ, і в ПЧ ці елементи пораховані 0 разів. ${QED}</p>
<p><span class="lbl">Формула включення-виключення для 4 множин:</span></p>
${eql(`∣${Ak(1)} ∪ ${Ak(2)} ∪ ${Ak(3)} ∪ ${Ak(4)}∣ = ∣${Ak(1)}∣ + ∣${Ak(2)}∣ + ∣${Ak(3)}∣ + ∣${Ak(4)}∣`)}
${eql(`&minus; ∣${Ak(1)}∩${Ak(2)}∣ − ∣${Ak(1)}∩${Ak(3)}∣ − ∣${Ak(1)}∩${Ak(4)}∣ − ∣${Ak(2)}∩${Ak(3)}∣ − ∣${Ak(2)}∩${Ak(4)}∣ − ∣${Ak(3)}∩${Ak(4)}∣`)}
${eql(`+ ∣${Ak(1)}∩${Ak(2)}∩${Ak(3)}∣ + ∣${Ak(1)}∩${Ak(2)}∩${Ak(4)}∣ + ∣${Ak(1)}∩${Ak(3)}∩${Ak(4)}∣ + ∣${Ak(2)}∩${Ak(3)}∩${Ak(4)}∣`)}
${eql(`&minus; ∣${Ak(1)}∩${Ak(2)}∩${Ak(3)}∩${Ak(4)}∣`)}`},
/*4*/{t:'Нерівність Коші між середнім арифметичним та середнім геометричним',a:`
<div class="box">∀<i>n</i> ∈ ℕ &nbsp;∀${s('a',1)}, ${s('a',2)}, …, ${s('a','n')} ≥ 0 виконується нерівність
${eq(`${f(`${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','n')}`,'<i>n</i>')} ≥ ${rt('n',`${s('a',1)}${s('a',2)} … ${s('a','n')}`)}`)}
<p>(ліва частина називається середнім арифметичним, права — середнім геометричним) (<i>AM</i> — arithmetic mean; <i>GM</i> — geometric mean).</p>
<p>Причому рівність досягається тоді й лише тоді, коли ${s('a',1)} = ${s('a',2)} = ⋯ = ${s('a','n')}.</p></div>
<p><span class="lbl">Зауваж.</span> Якщо хоча б одне з чисел ${s('a',1)}, …, ${s('a','n')} рівне нулю, то твердження очевидне. Надалі вважатимемо, що ${s('a',1)}, ${s('a',2)}, …, ${s('a','n')} &gt; 0.</p>
<p>${DEM}(за індукцією). <span class="lbl">Шаблон умови.</span> ✓ (параметр <i>n</i> ∈ ℕ)</p>
<p><span class="lbl">1. База індукції:</span> <i>n</i> = 1, 2.</p>
${eq(`<i>n</i> = 1 : &nbsp; ${f(s('a',1),'1')} ≥ ${rt('1',s('a',1))} &nbsp; ∀${s('a',1)} &gt; 0. ✓`)}
${eq(`<i>n</i> = 2 : &nbsp; ${f(`${s('a',1)} + ${s('a',2)}`,'2')} ≥<sup class="tip">?</sup> ${rt('',`${s('a',1)}${s('a',2)}`)}`)}
${eq(`${s('a',1)} + ${s('a',2)} ≥<sup class="tip">?</sup> 2${rt('',`${s('a',1)}${s('a',2)}`)}`)}
${eq(`${s('a',1)} − 2${rt('',`${s('a',1)}${s('a',2)}`)} + ${s('a',2)} ≥<sup class="tip">?</sup> 0`)}
<p>(${rt('',s('a',1))} − ${rt('',s('a',2))})<sup>2</sup> ≥ 0 — правда, причому рівність досягається тоді й лише тоді, коли ${s('a',1)} = ${s('a',2)}. ✓</p>
<p><span class="lbl">Індукційне припущення:</span> припустимо, що для <i>n</i> = <i>k</i> нерівність справедлива, тобто ∀${s('a',1)}, ${s('a',2)}, …, ${s('a','k')} &gt; 0 виконується нерівність</p>
${eq(`${f(`${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','k')}`,'<i>k</i>')} ≥ ${rt('k',`${s('a',1)}${s('a',2)} … ${s('a','k')}`)}`)}
<p>причому рівність досягається тоді й лише тоді, коли ${s('a',1)} = ${s('a',2)} = ⋯ = ${s('a','k')}.</p>
<p><span class="lbl">Індукційний перехід:</span> доведемо, що для <i>n</i> = <i>k</i>+1 нерівність справедлива, тобто ∀${s('a',1)}, ${s('a',2)}, …, ${s('a','k+1')} &gt; 0 виконується нерівність</p>
${eq(`${f(`${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','k+1')}`,'<i>k</i> + 1')} ≥ ${rt('k+1',`${s('a',1)}${s('a',2)} … ${s('a','k+1')}`)}`)}
<p>причому рівність досягається тоді й лише тоді, коли ${s('a',1)} = ${s('a',2)} = ⋯ = ${s('a','k+1')}.</p>
<p><span class="lbl">Доводимо:</span> введемо позначення:</p>
${eq(`${Ak('k')} = ${f(`${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','k')}`,'<i>k</i>')}, &nbsp;&nbsp; ${Ak('k+1')} = ${f(`${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','k+1')}`,'<i>k</i> + 1')}`)}
<div class="note"><b>з полів дошки</b>
${eql(`${Ak('k')} = ${f(`${s('a',1)} + ⋯ + ${s('a','k')}`,'<i>k</i>')}; &nbsp;&nbsp; <i>k</i>${Ak('k')} = ${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','k')};`)}
${eql(`${Ak('k+1')} = ${f(`${s('a',1)} + ⋯ + ${s('a','k+1')}`,'<i>k</i>+1')}; &nbsp;&nbsp; (<i>k</i>+1)${Ak('k+1')} = ${s('a',1)} + ${s('a',2)} + ⋯ + ${s('a','k+1')}`)}</div>
<p>Помітимо, що припущення індукції тоді переписується як ${Ak('k')} ≥ ${rt('k',`${s('a',1)}${s('a',2)} … ${s('a','k')}`)}, а те, що треба довести в індукційному переході — як ${Ak('k+1')} ≥<sup class="tip">?</sup> ${rt('k+1',`${s('a',1)}${s('a',2)} … ${s('a','k+1')}`)}.</p>
<p>Запишемо <b>нерівність Бернуллі</b> для <i>n</i> = (<i>k</i>+1) та <i>x</i> = ${f(Ak('k+1'),Ak('k'))} − 1:</p>
${eq(`( 1 + ( ${f(Ak('k+1'),Ak('k'))} − 1 ) )<sup>k+1</sup> ≥ 1 + (<i>k</i>+1)( ${f(Ak('k+1'),Ak('k'))} − 1 )`)}
<p>Зазначимо, що ${f(Ak('k+1'),Ak('k'))} − 1 &gt; −1, позаяк ${f(Ak('k+1'),Ak('k'))} &gt; 0, а тому нерівність Бернуллі можна застосовувати.</p>
<p><span class="lbl">Перетворюємо написане:</span></p>
${eq(`ЛЧ нер. Бернуллі: &nbsp; ( 1 + ( ${f(Ak('k+1'),Ak('k'))} − 1 ) )<sup>k+1</sup> = ( ${f(Ak('k+1'),Ak('k'))} )<sup>k+1</sup>`)}
${eq(`ПЧ нер. Бернуллі: &nbsp; 1 + (<i>k</i>+1)( ${f(Ak('k+1'),Ak('k'))} − 1 ) = 1 + ${f(`(<i>k</i>+1)${Ak('k+1')}`,Ak('k'))} − <i>k</i> − 1 = ${f(`(<i>k</i>+1)${Ak('k+1')}`,Ak('k'))} − <i>k</i> =`)}
${eq(`= ${f(`(<i>k</i>+1)${Ak('k+1')} − <i>k</i>${Ak('k')}`,Ak('k'))} = ${f(`(${s('a',1)} + ⋯ + ${s('a','k+1')}) − (${s('a',1)} + ⋯ + ${s('a','k')})`,Ak('k'))} = ${f(s('a','k+1'),Ak('k'))}`)}
<p>ЛЧ нер. Бернуллі ≥ ПЧ нер. Бернуллі, тобто</p>
${eq(`( ${f(Ak('k+1'),Ak('k'))} )<sup>k+1</sup> ≥ ${f(s('a','k+1'),Ak('k'))}`)}
${eq(`${f(`${A('k+1','k+1')}`,`${A('k','k+1')}`)} ≥ ${f(s('a','k+1'),Ak('k'))}. &nbsp; Помножимо обидві частини на ${A('k','k+1')}.`)}
${eq(`${A('k+1','k+1')} ≥ ${f(`${A('k','k+1')}${s('a','k+1')}`,Ak('k'))} = ${A('k','k')}${s('a','k+1')}`)}
<p><span class="lbl">Скористаємось припущенням індукції:</span></p>
${eq(`${A('k+1','k+1')} ≥ ${A('k','k')}${s('a','k+1')} ≥<sup class="tip">(∗)</sup> (${s('a',1)}${s('a',2)} … ${s('a','k')})${s('a','k+1')}, &nbsp; тобто`)}
${eq(`${A('k+1','k+1')} ≥ ${s('a',1)}${s('a',2)} … ${s('a','k')}${s('a','k+1')}, &nbsp; тобто &nbsp; ${Ak('k+1')} ≥ ${rt('k+1',`${s('a',1)}${s('a',2)} … ${s('a','k+1')}`)}, &nbsp; щ.т.д. щодо нерівностей`)}
<div class="note"><b>з полів дошки</b>припущення індукції: ${Ak('k')} ≥ ${rt('k',`${s('a',1)}${s('a',2)} … ${s('a','k')}`)} (піднесемо обидві частини до степеня <i>k</i>) &nbsp; ${A('k','k')} ≥ ${s('a',1)}${s('a',2)} … ${s('a','k')}.</div>
<p><span class="lbl">Тепер розберемось щодо випадку рівності:</span> для того, щоб ${Ak('k+1')} = ${rt('k+1',`${s('a',1)}${s('a',2)} … ${s('a','k+1')}`)}, в УСІХ вищезазначених переходах УСІ нерівності мають перетворюватись на рівності.</p>
<p>Зокрема, на рівність має перетворюватись перехід (∗), тобто має виконуватись, що ${Ak('k')} = ${rt('k',`${s('a',1)}${s('a',2)} … ${s('a','k')}`)}, що, згідно припущення індукції, означає, що ${s('a',1)} = ${s('a',2)} = ⋯ = ${s('a','k')}.</p>
<p>Але всі змінні у початковій нерівності рівноправні, тому аналогічним чином можна довести, що ${s('a',2)} = ${s('a',3)} = … ${s('a','k+1')}, тому, зрозуміло, ${s('a',1)} = ${s('a',2)} = … ${s('a','k')} = ${s('a','k+1')}, щ.т.д. ${QED}</p>
<div class="note"><b>з полів дошки</b>саме задля цього моменту нам потрібна була база для <i>n</i> = 1 ТА <i>n</i> = 2, щоб у цьому місці було <i>k</i> ≥ 2 і можна було сказати, що ${s('a',2)} входить як у перший ланцюжок рівностей ${s('a',1)} = ${s('a',2)} = ⋯ = ${s('a','k')}, так і у другий ${s('a',2)} = ${s('a',3)} = ⋯ = ${s('a','k+1')}, а тому всі числа між собою рівні.</div>`}
];

/* ================= скорочені відповіді N3 / N4 (kolok_exam_n34.md) ================= */
const big=(sg,top,bot)=>`<span class="sum"><span>${top}</span><span class="sg">${sg}</span><span>${bot}</span></span>`;
const SUT='<span class="lbl">Суть.</span> ';
const DV=(x='')=>`<span class="lbl">Доведення${x}.</span> `;
const a1n=(n)=>`${s('a',1)}${s('a',2)} ⋯ ${s('a',n)}`;

N3[1].s=`
<p>${SUT}Розміщення з <i>n</i> по <i>k</i> — це впорядкований вибір <i>k</i> різних елементів із <i>n</i>-елементної множини <i>M</i>, тобто кортеж довжини <i>k</i> з попарно різних елементів <i>M</i>. Порядок важливий.</p>
<div class="box"><b>Теорема.</b> ${eq(`${A('n','k')} = ${f('<i>n</i>!','(<i>n</i> − <i>k</i>)!')} = <i>n</i>(<i>n</i>−1) ⋯ (<i>n</i>−<i>k</i>+1)`)}</div>
<p>${DV()}Будуємо кортеж (${s('m',1)}, …, ${s('m','k')}) по місцях зліва направо.</p>
<ul>
<li>Перший елемент ${s('m',1)} можна обрати <i>n</i> способами.</li>
<li>Нехай ${s('m',1)}, …, ${s('m','i−1')} уже обрано. Вони попарно різні, тому для ${s('m','i')} залишається рівно <i>n</i> − (<i>i</i> − 1) допустимих елементів, і ця кількість не залежить від того, які саме елементи обрано раніше.</li>
<li>Для останнього місця <i>i</i> = <i>k</i> це <i>n</i> − <i>k</i> + 1 варіантів.</li>
</ul>
<p>За правилом добутку</p>
${eq(`${A('n','k')} = <i>n</i>(<i>n</i>−1) ⋯ (<i>n</i>−<i>k</i>+1)`)}
<p>Домножимо і поділимо на (<i>n</i>−<i>k</i>)! = (<i>n</i>−<i>k</i>)(<i>n</i>−<i>k</i>−1) ⋯ 2 · 1:</p>
${eq(`${A('n','k')} = ${f('<i>n</i>(<i>n</i>−1) ⋯ (<i>n</i>−<i>k</i>+1) · (<i>n</i>−<i>k</i>)(<i>n</i>−<i>k</i>−1) ⋯ 2 · 1','(<i>n</i>−<i>k</i>)!')} = ${f('<i>n</i>!','(<i>n</i>−<i>k</i>)!')}`)} ${QED}`;

N3[2].s=`
<p>${SUT}ММІ дозволяє довести твердження <i>P</i>(<i>n</i>) для всіх <i>n</i> ∈ ℕ, перевіривши базу <i>P</i>(1) і перехід <i>P</i>(<i>k</i>) ⇒ <i>P</i>(<i>k</i>+1). Потрібно обґрунтувати, чому цього досить.</p>
<p>${DV()}Від супротивного, використовуючи, що в кожній непорожній підмножині ℕ є найменший елемент.</p>
<p>Нехай <i>P</i>(1) доведено і для кожного <i>k</i> з <i>P</i>(<i>k</i>) випливає <i>P</i>(<i>k</i>+1). Припустимо, що множина</p>
${eq(`<i>S</i> = {<i>n</i> ∈ ℕ : <i>P</i>(<i>n</i>) хибне}`)}
<p>непорожня. Тоді в ній є найменший елемент ${s('n',0)}.</p>
<ol>
<li>${s('n',0)} ≠ 1, бо <i>P</i>(1) вірне. Отже ${s('n',0)} − 1 ∈ ℕ.</li>
<li>${s('n',0)} − 1 &lt; ${s('n',0)}, а ${s('n',0)} — найменший елемент <i>S</i>, тому ${s('n',0)} − 1 ∉ <i>S</i>, тобто <i>P</i>(${s('n',0)} − 1) вірне.</li>
<li>За індукційним переходом при <i>k</i> = ${s('n',0)} − 1 з <i>P</i>(${s('n',0)} − 1) випливає <i>P</i>(${s('n',0)}), тобто ${s('n',0)} ∉ <i>S</i>.</li>
</ol>
<p>Це суперечить ${s('n',0)} ∈ <i>S</i>. Отже <i>S</i> = ∅, і <i>P</i>(<i>n</i>) вірне для всіх <i>n</i> ∈ ℕ. ${QED}</p>`;

N3[3].s=`
<p>${SUT}Метод доведення тверджень <i>P</i>(<i>n</i>), що залежать від параметра <i>n</i> ∈ ℕ. Нестрого — це формалізація слів «і так далі». Строго, він ґрунтується на принципі: якщо <i>P</i>(1) вірне і <i>P</i>(<i>k</i>) ⇒ <i>P</i>(<i>k</i>+1) для всіх <i>k</i>, то <i>P</i>(<i>n</i>) вірне для всіх <i>n</i>.</p>
<div class="box">
<p><b>0) Шаблон умови:</b> є параметр <i>n</i> ∈ ℕ.</p>
<p><b>1) База індукції:</b> перевіряємо твердження для малих <i>n</i>, найчастіше для <i>n</i> = 1 (інколи для <i>n</i> = 1, 2; тоді перехід доводиться для <i>k</i> ≥ 2).</p>
<p><b>2) Індукційне припущення:</b> припускаємо, що твердження виконується для <i>n</i> = <i>k</i>.</p>
<p><b>3) Індукційний перехід:</b> доводимо, що воно виконується для <i>n</i> = <i>k</i> + 1, використовуючи припущення.</p>
</div>
<p><span class="lbl">Оформлення.</span> Перехід починаємо словами «доведемо, що…», після чого дослівно записуємо твердження, де скрізь <i>k</i> замінено на <i>k</i> + 1. Припущення формулюємо повністю і без займенників.</p>`;

N3[4].s=`
<p>${SUT}${C('n','k')} — кількість <i>k</i>-елементних підмножин <i>n</i>-елементної множини (вибір без урахування порядку). Властивість — рекурентне співвідношення (правило трикутника Паскаля): для 0 ≤ <i>k</i> ≤ <i>n</i> − 1</p>
<div class="box">${eq(`${C('n+1','k+1')} = ${C('n','k+1')} + ${C('n','k')}`)}</div>
<p>${DV(' (алгебраїчне)')}Ліва частина:</p>
${eq(`${C('n+1','k+1')} = ${f('(<i>n</i>+1)!','(<i>k</i>+1)! (<i>n</i>−<i>k</i>)!')}`)}
<p>Права частина. Скористаємося тим, що (<i>n</i>−<i>k</i>)! = (<i>n</i>−<i>k</i>)(<i>n</i>−<i>k</i>−1)! і (<i>k</i>+1)! = (<i>k</i>+1)<i>k</i>!:</p>
${eq(`${C('n','k+1')} = ${f('<i>n</i>!','(<i>k</i>+1)! (<i>n</i>−<i>k</i>−1)!')} = ${f('<i>n</i>! (<i>n</i>−<i>k</i>)','(<i>k</i>+1)! (<i>n</i>−<i>k</i>)!')}`)}
${eq(`${C('n','k')} = ${f('<i>n</i>!','<i>k</i>! (<i>n</i>−<i>k</i>)!')} = ${f('<i>n</i>! (<i>k</i>+1)','(<i>k</i>+1)! (<i>n</i>−<i>k</i>)!')}`)}
<p>Додаємо:</p>
${eq(`${C('n','k+1')} + ${C('n','k')} = ${f('<i>n</i>! [(<i>n</i>−<i>k</i>) + (<i>k</i>+1)]','(<i>k</i>+1)! (<i>n</i>−<i>k</i>)!')} = ${f('<i>n</i>! (<i>n</i>+1)','(<i>k</i>+1)! (<i>n</i>−<i>k</i>)!')} = ${f('(<i>n</i>+1)!','(<i>k</i>+1)! (<i>n</i>−<i>k</i>)!')}`)}
<p>Ліва і права частини рівні. ${QED}</p>
<p>${DV(' (комбінаторне)')}Нехай у класі <i>n</i> + 1 учень, серед яких фіксований учень (Монтальбан). Порахуємо кількість способів обрати групу з <i>k</i> + 1 чергового двома способами.</p>
<p><i>Перший спосіб.</i> Групу з <i>k</i> + 1 учня обираємо з усіх <i>n</i> + 1: ${C('n+1','k+1')} способів.</p>
<p><i>Другий спосіб.</i> Усі групи розбиваються на дві непересічні множини:</p>
<ul>
<li>групи, що містять Монтальбана: решту <i>k</i> чергових обираємо з <i>n</i> інших учнів, це ${C('n','k')} способів;</li>
<li>групи, що його не містять: усіх <i>k</i> + 1 чергових обираємо з <i>n</i> інших учнів, це ${C('n','k+1')} способів.</li>
</ul>
<p>За правилом суми разом ${C('n','k')} + ${C('n','k+1')} способів.</p>
<p>Обидва способи рахують одну й ту саму множину груп, тому ${C('n+1','k+1')} = ${C('n','k+1')} + ${C('n','k')}. ${QED}</p>`;

N3[5].s=`
<p>${SUT}Формула розкладу <i>n</i>-го степеня суми двох доданків:</p>
<div class="box">${eq(`(<i>a</i> + <i>b</i>)<sup>n</sup> = ${sum('n','k=0')} ${C('n','k')} <i>a</i><sup>n−k</sup><i>b</i><sup>k</sup>`)}</div>
<p>${DV()}Запишемо (<i>a</i>+<i>b</i>)<sup>n</sup> = (<i>a</i>+<i>b</i>)(<i>a</i>+<i>b</i>) ⋯ (<i>a</i>+<i>b</i>) (<i>n</i> множників) і розкриємо дужки за дистрибутивністю. Результат — сума всіх добутків, у яких з кожного з <i>n</i> множників взято або <i>a</i>, або <i>b</i>.</p>
<p>Зафіксуємо <i>k</i> і розглянемо добутки, у яких <i>b</i> взято рівно з <i>k</i> множників (а <i>a</i> — з решти <i>n</i> − <i>k</i>). За комутативністю кожен такий добуток дорівнює <i>a</i><sup>n−k</sup><i>b</i><sup>k</sup>. Різні такі добутки відповідають різним <i>k</i>-елементним множинам номерів множників, з яких взято <i>b</i>. Отже, їх рівно ${C('n','k')}.</p>
<p>Тому після зведення подібних доданок <i>a</i><sup>n−k</sup><i>b</i><sup>k</sup> має коефіцієнт ${C('n','k')}. ${QED}</p>`;

N3[6].s=`
<p>${SUT}Сума всіх біноміальних коефіцієнтів <i>n</i>-го рядка дорівнює 2<sup>n</sup>:</p>
<div class="box">${eq(`${sum('n','k=0')} ${C('n','k')} = ${C('n',0)} + ${C('n',1)} + ⋯ + ${C('n','n')} = 2<sup>n</sup>`)}</div>
<p>${DV(' (алгебраїчне)')}У біномі Ньютона покладемо <i>a</i> = <i>b</i> = 1:</p>
${eq(`2<sup>n</sup> = (1+1)<sup>n</sup> = ${sum('n','k=0')} ${C('n','k')} · 1<sup>n−k</sup> · 1<sup>k</sup> = ${sum('n','k=0')} ${C('n','k')}`)} ${QED}
<p>${DV(' (комбінаторне)')}Порахуємо кількість способів відправити на олімпіаду довільну частину (можливо порожню) з <i>n</i> учнів.</p>
<p><i>Перший спосіб.</i> Розіб'ємо за кількістю <i>k</i> відправлених учнів, <i>k</i> = 0, 1, …, <i>n</i>. Для фіксованого <i>k</i> є ${C('n','k')} способів. Групи з різною кількістю учнів різні, тому за правилом суми разом ${sum('n','k=0')} ${C('n','k')}.</p>
<p><i>Другий спосіб.</i> Для кожного з <i>n</i> учнів незалежно приймається рішення: відправити чи ні, тобто 2 варіанти. За правилом добутку разом 2<sup>n</sup> способів.</p>
<p>Обидва способи рахують одну й ту саму кількість, тому ${sum('n','k=0')} ${C('n','k')} = 2<sup>n</sup>. ${QED}</p>`;

N3[7].s=`
<p>${SUT}Сполука з <i>n</i> по <i>k</i> — це <i>k</i>-елементна підмножина <i>n</i>-елементної множини <i>M</i> (вибір без урахування порядку).</p>
<div class="box"><b>Теорема 3.</b> ${eq(`${C('n','k')} = ${f('<i>n</i>!','<i>k</i>! (<i>n</i>−<i>k</i>)!')} = ${f('<i>n</i>(<i>n</i>−1) ⋯ (<i>n</i>−<i>k</i>+1)','1 · 2 ⋯ <i>k</i>')}`)}</div>
<p>${DV()}Порівняємо розміщення і сполуки. Кожному розміщенню (${s('m',1)}, …, ${s('m','k')}) поставимо у відповідність сполуку {${s('m',1)}, …, ${s('m','k')}} — множину його елементів.</p>
<p>Для фіксованої <i>k</i>-елементної підмножини ${s('M',1)} ⊆ <i>M</i> розміщень, що їй відповідають, рівно стільки, скільки є способів розставити її <i>k</i> елементів у кортеж, тобто <i>k</i>! (за теоремою про кількість перестановок). Усі розміщення розбиваються за відповідною підмножиною на групи по <i>k</i>!, а кількість груп дорівнює ${C('n','k')}. Отже, за правилом суми</p>
${eq(`${A('n','k')} = ${C('n','k')} · <i>k</i>!`)}
<p>Звідси за теоремою про ${A('n','k')}</p>
${eq(`${C('n','k')} = ${f(A('n','k'),'<i>k</i>!')} = ${f('<i>n</i>!','(<i>n</i>−<i>k</i>)! <i>k</i>!')}`)} ${QED}`;

N4[1].s=`
<p>${SUT}Нижня оцінка степеня лінійною функцією: для всіх <i>n</i> ∈ ℕ і <i>x</i> ≥ −1</p>
<div class="box">${eq(`(1 + <i>x</i>)<sup>n</sup> ≥ 1 + <i>nx</i>`)}</div>
<p>${DV(' (індукція по <i>n</i>)')}Фіксуємо довільне <i>x</i> ≥ −1.</p>
<p><i>База</i> <i>n</i> = 1: (1+<i>x</i>)<sup>1</sup> = 1 + <i>x</i> = 1 + 1 · <i>x</i>. Нерівність виконується.</p>
<p><i>Індукційне припущення:</i> (1+<i>x</i>)<sup>k</sup> ≥ 1 + <i>kx</i>.</p>
<p><i>Індукційний перехід.</i> Доведемо, що (1+<i>x</i>)<sup>k+1</sup> ≥ 1 + (<i>k</i>+1)<i>x</i>.</p>
<p>Оскільки <i>x</i> ≥ −1, маємо 1 + <i>x</i> ≥ 0. Тому можна помножити обидві частини припущення на 1 + <i>x</i> зі збереженням знака нерівності:</p>
${eq(`(1+<i>x</i>)<sup>k+1</sup> ≥ (1+<i>kx</i>)(1+<i>x</i>) = 1 + (<i>k</i>+1)<i>x</i> + <i>kx</i><sup>2</sup>`)}
<p>Оскільки <i>kx</i><sup>2</sup> ≥ 0, отримуємо</p>
${eq(`(1+<i>x</i>)<sup>k+1</sup> ≥ 1 + (<i>k</i>+1)<i>x</i>`)} ${QED}
<div class="note"><b>Зауваження</b>Множити на 1 + <i>x</i> без зміни знака можна саме тому, що 1 + <i>x</i> ≥ 0. Також з доведення видно, що при <i>k</i> ≥ 1 рівність можлива лише за <i>x</i> = 0 (бо потрібно <i>kx</i><sup>2</sup> = 0).</div>`;

N4[2].s=`
<p>${SUT}Поліноміальний коефіцієнт ${C('n','k<sub>1</sub>,…,k<sub>m</sub>')} — кількість розбиттів <i>n</i>-елементної множини на <i>m</i> підмножин заданих розмірів ${s('k',1)}, …, ${s('k','m')} (при <i>m</i> = 2 це ${C('n','k')}). Поліноміальна формула — узагальнення бінома Ньютона на суму <i>m</i> доданків.</p>
<p><span class="lbl">Задача.</span> Нехай ∣<i>A</i>∣ = <i>n</i>, а ${s('k',1)}, …, ${s('k','m')} — цілі невід'ємні числа, ${s('k',1)} + ⋯ + ${s('k','m')} = <i>n</i>. Скільки існує впорядкованих розбиттів (${s('A',1)}, …, ${s('A','m')}) множини <i>A</i> (підмножини попарно не перетинаються, їх об'єднання — <i>A</i>) з ∣${s('A','i')}∣ = ${s('k','i')}?</p>
<p><span class="lbl">Розв'язок.</span> Обираємо підмножини послідовно.</p>
<ul>
<li>${s('A',1)} — довільна ${s('k',1)}-елементна підмножина <i>A</i>: ${C('n','k<sub>1</sub>')} способів.</li>
<li>${s('A',2)} — ${s('k',2)}-елементна підмножина в <i>A</i> ∖ ${s('A',1)}, який має <i>n</i> − ${s('k',1)} елементів: ${C('n−k<sub>1</sub>','k<sub>2</sub>')} способів.</li>
<li>Загалом ${s('A','i')} обираємо з <i>n</i> − ${s('k',1)} − ⋯ − ${s('k','i−1')} елементів, що залишились: ${C('n−k<sub>1</sub>−⋯−k<sub>i−1</sub>','k<sub>i</sub>')} способів.</li>
<li>${s('A','m')} — це всі елементи, що залишились: ${C('k<sub>m</sub>','k<sub>m</sub>')} = 1.</li>
</ul>
<p>На кожному кроці кількість варіантів не залежить від результатів попередніх виборів, тому за правилом добутку</p>
${eq(`${C('n','k<sub>1</sub>')} ${C('n−k<sub>1</sub>','k<sub>2</sub>')} ⋯ ${C('k<sub>m</sub>','k<sub>m</sub>')} = ${f('<i>n</i>!','k<sub>1</sub>! (<i>n</i>−k<sub>1</sub>)!')} · ${f('(<i>n</i>−k<sub>1</sub>)!','k<sub>2</sub>! (<i>n</i>−k<sub>1</sub>−k<sub>2</sub>)!')} ⋯ ${f('k<sub>m</sub>!','k<sub>m</sub>! 0!')} = ${f('<i>n</i>!','k<sub>1</sub>! k<sub>2</sub>! ⋯ k<sub>m</sub>!')}`)}
<p>Факторіали (<i>n</i>−${s('k',1)})!, (<i>n</i>−${s('k',1)}−${s('k',2)})!, … скорочуються послідовно. Позначаємо</p>
<div class="box">${eq(`${C('n','k<sub>1</sub>,…,k<sub>m</sub>')} = ${f('<i>n</i>!','k<sub>1</sub>! k<sub>2</sub>! ⋯ k<sub>m</sub>!')}`)}</div>
<div class="box"><b>Теорема 2 (поліноміальна формула).</b>
${eq(`(${s('a',1)} + ⋯ + ${s('a','m')})<sup>n</sup> = ${sum('','k<sub>1</sub>+⋯+k<sub>m</sub>=n')} ${C('n','k<sub>1</sub>,…,k<sub>m</sub>')} <i>a</i><sub>1</sub><sup>k<sub>1</sub></sup><i>a</i><sub>2</sub><sup>k<sub>2</sub></sup> ⋯ <i>a</i><sub>m</sub><sup>k<sub>m</sub></sup>`)}</div>
<p>${DV()}Розкриваємо <i>n</i> дужок за дистрибутивністю: результат — сума добутків, де з кожної дужки взято один доданок ${s('a','i')}.</p>
<p>Одночлен <i>a</i><sub>1</sub><sup>k<sub>1</sub></sup> ⋯ <i>a</i><sub>m</sub><sup>k<sub>m</sub></sup> утворюється тоді й лише тоді, коли ${s('a',1)} взято рівно з ${s('k',1)} дужок, ${s('a',2)} — рівно з ${s('k',2)} дужок, і так далі. Така вибірка — це розбиття множини номерів дужок {1, …, <i>n</i>} на підмножини розмірів ${s('k',1)}, …, ${s('k','m')} (підмножина номерів дужок, з яких взято ${s('a','i')}).</p>
<p>За попередньою задачею таких розбиттів ${C('n','k<sub>1</sub>,…,k<sub>m</sub>')}, тож це і є коефіцієнт при <i>a</i><sub>1</sub><sup>k<sub>1</sub></sup> ⋯ <i>a</i><sub>m</sub><sup>k<sub>m</sub></sup>. ${QED}</p>`;

N4[3].s=`
<p>${SUT}Формула кількості елементів в об'єднанні скінченних множин, що можуть перетинатися. Для двох множин ∣<i>A</i> ∪ <i>B</i>∣ = ∣<i>A</i>∣ + ∣<i>B</i>∣ − ∣<i>A</i> ∩ <i>B</i>∣, бо елементи перетину інакше враховуються двічі. Для <i>k</i> множин знаки чергуються:</p>
<div class="box">${eq(`∣${big('⋃','k','i=1')} ${s('A','i')}∣ = ${sum('k','s=1')} (−1)<sup>s−1</sup> ${sum('','1≤i<sub>1</sub>&lt;⋯&lt;i<sub>s</sub>≤k')} ∣<i>A</i><sub>i<sub>1</sub></sub> ∩ ⋯ ∩ <i>A</i><sub>i<sub>s</sub></sub>∣`)}</div>
<p>Для 4 множин:</p>
${eq(`∣${s('A',1)} ∪ ${s('A',2)} ∪ ${s('A',3)} ∪ ${s('A',4)}∣ = Σ∣${s('A','i')}∣ − ${sum('','i&lt;j')}∣${s('A','i')} ∩ ${s('A','j')}∣ + ${sum('','i&lt;j&lt;l')}∣${s('A','i')} ∩ ${s('A','j')} ∩ ${s('A','l')}∣ − ∣${s('A',1)} ∩ ${s('A',2)} ∩ ${s('A',3)} ∩ ${s('A',4)}∣`)}
<p>${DV()}Покажемо, що кожен елемент вкладає однакову кількість у ліву і праву частини. Розглянемо довільний елемент <i>x</i> універсальної множини.</p>
<p><i>Випадок 1:</i> <i>x</i> не належить жодній ${s('A','i')}. Він не входить ні в ліву частину, ні в жоден з перетинів у правій. Вклад 0 з обох боків.</p>
<p><i>Випадок 2:</i> <i>x</i> належить рівно <i>s</i> ≥ 1 множинам; для зручності позначимо їх ${s('A',1)}, …, ${s('A','s')} (для іншого набору міркування ті самі).</p>
<ul>
<li>У лівій частині <i>x</i> враховується один раз.</li>
<li>У правій частині <i>x</i> входить у перетин <i>A</i><sub>i<sub>1</sub></sub> ∩ ⋯ ∩ <i>A</i><sub>i<sub>j</sub></sub> тоді й лише тоді, коли всі індекси ${s('i',1)}, …, ${s('i','j')} належать {1, …, <i>s</i>}. Таких перетинів для даного <i>j</i> рівно ${C('s','j')}.</li>
<li>Тому вклад <i>x</i> у праву частину дорівнює</li>
</ul>
${eq(`${sum('s','j=1')} (−1)<sup>j−1</sup>${C('s','j')} = ${C('s',1)} − ${C('s',2)} + ${C('s',3)} − ⋯ + (−1)<sup>s−1</sup>${C('s','s')}`)}
<p>Обчислимо цю суму. За біномом Ньютона</p>
${eq(`0 = (1 − 1)<sup>s</sup> = ${sum('s','j=0')} (−1)<sup>j</sup>${C('s','j')} = 1 − ${sum('s','j=1')} (−1)<sup>j−1</sup>${C('s','j')}`)}
<p>звідки ${sum('s','j=1')} (−1)<sup>j−1</sup>${C('s','j')} = 1.</p>
<p>Отже, і в лівій, і в правій частині <i>x</i> враховується рівно один раз. Оскільки це виконується для кожного елемента, частини рівні. ${QED}</p>`;

N4[4].s=`
<p>${SUT}Середнє арифметичне невід'ємних чисел не менше за їх середнє геометричне:</p>
<div class="box">${eq(`${f(`${s('a',1)} + ⋯ + ${s('a','n')}`,'<i>n</i>')} ≥ ${rt('n',`${s('a',1)} ⋯ ${s('a','n')}`)} &nbsp;&nbsp; (${s('a','i')} ≥ 0)`)}
<p>причому рівність досягається тоді й лише тоді, коли ${s('a',1)} = ⋯ = ${s('a','n')}.</p></div>
<p>${DV(' (індукція по <i>n</i>)')}Якщо хоча б одне ${s('a','i')} = 0, то права частина дорівнює 0, а ліва невід'ємна, тож нерівність очевидна. Надалі всі ${s('a','i')} &gt; 0.</p>
<p><i>База.</i> <i>n</i> = 1: ${s('a',1)} = ${rt('1',s('a',1))}, рівність.<br>
(Для <i>n</i> = 2: ${f(`${s('a',1)} + ${s('a',2)}`,'2')} ≥ ${rt('',`${s('a',1)}${s('a',2)}`)} ⟺ (${rt('',s('a',1))} − ${rt('',s('a',2))})<sup>2</sup> ≥ 0, рівність при ${s('a',1)} = ${s('a',2)}.)</p>
<p><i>Індукційне припущення.</i> Для <i>n</i> = <i>k</i> нерівність виконується для довільних додатних ${s('a',1)}, …, ${s('a','k')}, причому рівність лише коли вони всі рівні. Позначимо ${Ak('k')} = ${f(`${s('a',1)} + ⋯ + ${s('a','k')}`,'<i>k</i>')}, тоді ${A('k','k')} ≥ ${a1n('k')}.</p>
<p><i>Індукційний перехід.</i> Доведемо, що для ${s('a',1)}, …, ${s('a','k+1')} &gt; 0 виконується ${Ak('k+1')} ≥ ${rt('k+1',`${s('a',1)} ⋯ ${s('a','k+1')}`)}, де ${Ak('k+1')} = ${f(`${s('a',1)} + ⋯ + ${s('a','k+1')}`,'<i>k</i> + 1')}.</p>
<p>Нехай <i>x</i> = ${f(Ak('k+1'),Ak('k'))} − 1. Оскільки ${Ak('k+1')}, ${Ak('k')} &gt; 0, маємо <i>x</i> &gt; −1, тож нерівність Бернуллі з показником <i>k</i> + 1 застосовна:</p>
${eq(`( ${f(Ak('k+1'),Ak('k'))} )<sup>k+1</sup> ≥ 1 + (<i>k</i>+1)( ${f(Ak('k+1'),Ak('k'))} − 1 )`)}
<p>Спростимо праву частину, враховуючи (<i>k</i>+1)${Ak('k+1')} − <i>k</i>${Ak('k')} = ${s('a','k+1')}:</p>
${eq(`1 + (<i>k</i>+1)${f(Ak('k+1'),Ak('k'))} − (<i>k</i>+1) = ${f(`(<i>k</i>+1)${Ak('k+1')} − <i>k</i>${Ak('k')}`,Ak('k'))} = ${f(s('a','k+1'),Ak('k'))}`)}
<p>Отже ( ${f(Ak('k+1'),Ak('k'))} )<sup>k+1</sup> ≥ ${f(s('a','k+1'),Ak('k'))}. Помножимо на ${A('k','k+1')} &gt; 0:</p>
${eq(`${A('k+1','k+1')} ≥ ${A('k','k')} ${s('a','k+1')}`)}
<p>За індукційним припущенням ${A('k','k')} ≥ ${a1n('k')}, а ${s('a','k+1')} &gt; 0, тому</p>
${eq(`${A('k+1','k+1')} ≥ ${a1n('k')} ${s('a','k+1')}`)}
<p>Добувши корінь (<i>k</i>+1)-го степеня з невід'ємних частин, отримуємо ${Ak('k+1')} ≥ ${rt('k+1',`${s('a',1)} ⋯ ${s('a','k+1')}`)}. Нерівність доведено.</p>
<p><span class="lbl">Випадок рівності.</span> Якщо ${s('a',1)} = ⋯ = ${s('a','k+1')} = <i>a</i>, то обидві частини дорівнюють <i>a</i>.</p>
<p>Навпаки, нехай у нерівності для <i>k</i> + 1 чисел досягається рівність. Тоді в ланцюжку</p>
${eq(`${A('k+1','k+1')} &nbsp;≥&nbsp; ${A('k','k')} ${s('a','k+1')} &nbsp;≥&nbsp; ${s('a',1)} ⋯ ${s('a','k+1')}`)}
<p>обидві нерівності обертаються на рівності.</p>
<ul>
<li>Рівність у першій означає рівність у нерівності Бернуллі для <i>n</i> = <i>k</i> + 1 ≥ 2, що можливо лише при <i>x</i> = 0, тобто ${Ak('k+1')} = ${Ak('k')}.</li>
<li>Рівність у другій (при ${s('a','k+1')} &gt; 0) означає ${A('k','k')} = ${a1n('k')}, і за припущенням ${s('a',1)} = ⋯ = ${s('a','k')}. Тоді ${Ak('k')} дорівнює цьому спільному значенню.</li>
</ul>
<p>З ${Ak('k+1')} = ${Ak('k')} маємо ${s('a','k+1')} = (<i>k</i>+1)${Ak('k+1')} − <i>k</i>${Ak('k')} = ${Ak('k')}. Тобто всі <i>k</i> + 1 чисел рівні. ${QED}</p>`;

/* ================= логіка ================= */
const LEVELS=[
  {n:1,data:N1,m:23,label:'означення',pick:k=>[mods(k,23),mods(k+12,23)],ex:k=>[[k,23],[k+12,23]],pts:'1 бал кожне'},
  {n:2,data:N2,m:9, label:'приклади',  pick:k=>[mods(k,9), mods(k+5,9)], ex:k=>[[k,9],[k+5,9]],  pts:'1,5 бала кожне'},
  {n:3,data:N3,m:7, label:'доведення (нескладне)',pick:k=>[mods(k,7)],   ex:k=>[[k,7]],          pts:'4 бали'},
  {n:4,data:N4,m:4, label:'доведення (складне)',  pick:k=>[mods(k,4)],   ex:k=>[[k,4]],          pts:'6 балів'}
];

/* a mod* b  — залишок, але 0 замінюємо на b */
function mods(a,b){const r=a%b; return r===0?b:r;}

const $=id=>document.getElementById(id);
const out=$('out'), calcEl=$('calc');

/* режим відповіді для доведень: 'a' — повне, 's' — скорочене (запам'ятовується) */
let mode='a';

/* тіло відповіді: для доведень — перемикач і дві версії */
function body(item){
  if(!item.s) return item.a;
  const m=mode==='s'?'s':'a';
  return `<div class="sw"><button data-v="a" class="${m==='a'?'on':''}" aria-pressed="${m==='a'}">Повне</button><button data-v="s" class="${m==='s'?'on':''}" aria-pressed="${m==='s'}">Скорочене</button></div>
    <div class="va"${m==='a'?'':' hidden'}>${item.a}</div><div class="vs"${m==='s'?'':' hidden'}>${item.s}</div>`;
}

function card(lvl,num,item){
  const head=`<div class="qh"><span class="num">N${lvl} · №${num}</span>
    <span class="qt">${item?item.t:'—'}</span></div>`;
  return `<div class="q lv${lvl}" id="c-${lvl}-${num}">${head}${item?body(item):''}</div>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.sw button'); if(!b) return;
  const q=b.closest('.q,.qa'), v=b.dataset.v;
  q.querySelectorAll('.sw button').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
  q.querySelector('.va').hidden=v!=='a';
  q.querySelector('.vs').hidden=v!=='s';
  mode=v;
  try{localStorage.setItem('kolok_mode',v)}catch(err){}
});

function render(k){
  if(!(k>=1&&k<=100)){out.innerHTML='<p class="empty">Варіант має бути числом від 1 до 100</p>';calcEl.innerHTML='';return;}
  let html='', calc=[];
  for(const L of LEVELS){
    const nums=L.pick(k);
    calc.push(nums.map((v,i)=>{const [a,b]=L.ex(k)[i];return `<a href="#c-${L.n}-${v}"><code>${a} mod* ${b} = ${v}</code></a>`;}).join(' '));
    html+=`<div class="lvl lv${L.n}"><em>Nivel</em> ${L.n} — ${L.label} · ${L.pts}</div>`;
    for(const num of nums) html+=card(L.n,num,L.data[num]);
  }
  calcEl.innerHTML='<b>Варіант '+k+':</b>'+
    LEVELS.map((L,i)=>`<span class="cl lv${L.n}"><b>Nivel ${L.n}:</b> ${calc[i]}</span>`).join('');
  out.innerHTML=html;
}

/* «Усі питання»: список для повторення, відповідь відкривається тапом */
const list=$('list');
function renderList(){
  let html='';
  for(const L of LEVELS){
    html+=`<div class="lvl lv${L.n}"><em>Nivel</em> ${L.n} — ${L.label}</div><div class="acc lv${L.n}">`;
    for(let i=1;i<=L.m;i++){
      const it=L.data[i];
      html+=`<details class="qa lv${L.n}"><summary><span class="num">${i}</span><span class="qt">${it.t}</span></summary>
        <div class="qa-b">${body(it)}</div></details>`;
    }
    html+='</div>';
  }
  list.innerHTML=html;
}

function showTab(all){
  $('tab-var').classList.toggle('on',!all); $('tab-var').setAttribute('aria-selected',!all);
  $('tab-all').classList.toggle('on',all);  $('tab-all').setAttribute('aria-selected',all);
  $('pane-var').hidden=all; out.hidden=all;
  $('pane-all').hidden=!all; list.hidden=!all;
  if(all&&!list.innerHTML) renderList();
  window.scrollTo(0,0);
}
$('tab-var').onclick=()=>showTab(false);
$('tab-all').onclick=()=>showTab(true);

const kEl=$('k');
$('go').onclick=()=>{kEl.blur();render(parseInt(kEl.value,10));};
kEl.addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
/* на старті в полі 0: при тапі прибираємо його, щоб одразу вводити число */
kEl.addEventListener('focus',()=>{if(kEl.value==='0')kEl.value='';});
kEl.addEventListener('blur',()=>{if(kEl.value==='')kEl.value='0';});

/* кнопка «нагору» */
const toTop=$('totop');
addEventListener('scroll',()=>{toTop.hidden=scrollY<700;},{passive:true});
toTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

/* світла / темна тема */
const root=document.documentElement, sysDark=matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':sysDark.matches;
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
function paintTheme(){
  const d=isDark();
  $('theme').innerHTML=d?SUN:MOON;
  $('theme').setAttribute('aria-label',d?'Увімкнути світлу тему':'Увімкнути темну тему');
}
$('theme').onclick=()=>{
  root.dataset.theme=isDark()?'light':'dark';
  try{localStorage.setItem('kolok_theme',root.dataset.theme)}catch(e){}
  paintTheme();
};
sysDark.addEventListener?.('change',paintTheme);
paintTheme();

/* розмір шрифту */
let fs=17;
const setFs=d=>{fs=Math.min(26,Math.max(13,fs+d));document.documentElement.style.setProperty('--fs',fs+'px');
  try{localStorage.setItem('kolok_fs',fs)}catch(e){}};
$('fplus').onclick=()=>setFs(1);
$('fminus').onclick=()=>setFs(-1);

/* таймер 7 хв */
let left=420, tid=null;
const tBtn=$('tstart'), tEl=$('timer'), tIc=tBtn.querySelector('.ti');
const show=()=>{const m=Math.floor(left/60),s2=String(left%60).padStart(2,'0');
  tEl.textContent=`${m}:${s2}`; tBtn.classList.toggle('hot',left<=60);};
tBtn.onclick=()=>{
  if(tid){clearInterval(tid);tid=null;left=420;show();tIc.textContent='▶';return;}
  left=420;show();tIc.textContent='⏹';
  tid=setInterval(()=>{left--;show();
    if(left<=0){clearInterval(tid);tid=null;tEl.textContent='ЧАС!';tIc.textContent='↺';}},1000);
};

/* офлайн-режим: реєструємо service worker, якщо сторінка віддається по http(s).
   З file:// це неможливо — там сторінка й так локальна, тому мовчки пропускаємо. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')
   && !location.hostname.endsWith('claude.ai')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* відновлення */
try{
  const sf=parseInt(localStorage.getItem('kolok_fs'),10);
  if(sf){fs=sf;document.documentElement.style.setProperty('--fs',fs+'px');}
  if(localStorage.getItem('kolok_mode')==='s') mode='s';
  localStorage.removeItem('kolok_k');
}catch(e){}
</script>
</body>
</html>
